name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The chrome is checked rendered (npm run ui), which needs a browser to render it in.
      - run: npx playwright install --with-deps chromium

      - run: npm run check
