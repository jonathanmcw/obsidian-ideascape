name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The chrome is checked rendered (npm run ui), which needs a browser to render it in — both of them: Obsidian is
      # Electron on a desktop and a WKWebView on iPhone and iPad, and a name too long for its band is laid out
      # differently by each. Without WebKit here the run still passes, having checked only half the app.
      - run: npx playwright install --with-deps chromium webkit

      - run: npm run check
