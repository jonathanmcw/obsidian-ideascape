  <text x="144" y="95" fill="#F0EFEB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="650" letter-spacing="-0.4">Ideascape</text>
  <text x="144" y="130" fill="#AAA9A4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400">Build a mind map from the keyboard. Tab adds a child,</text>
  <text x="144" y="158" fill="#AAA9A4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="400">Enter a sibling, and typing fills it in.</text>

  <rect x="1046" y="84" width="88" height="40" rx="20" fill="#2A2A2C" stroke="#3A3A3C"/>
  <text x="1090" y="110" text-anchor="middle" fill="#C9C8C4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600">PLUGIN</text>
</svg>
